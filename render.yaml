services:
  - type: web
    name: sheath-academy-dashboard
    runtime: python
    runtimeVersion: 3.12.0
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd features/dashboard/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: PIP_DISABLE_PIP_VERSION_CHECK
        value: "1"
      - key: NPM_CONFIG_CACHE
        value: "/tmp/npm-cache"
      - key: TMPDIR
        value: "/tmp"
