services:
  - type: web
    name: sheath-academy-dashboard
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd features/dashboard/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: CARGO_NET_OFFLINE
        value: "false"
