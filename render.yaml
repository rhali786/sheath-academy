services:
  - type: web
    name: sheath-academy-dashboard
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd features/dashboard/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: PIP_DISABLE_PIP_VERSION_CHECK
        value: "1"
      - key: CARGO_NET_OFFLINE
        value: "true"
      - key: CARGO_HTTP_MULTIPLEXING
        value: "false"
      - key: NPM_CONFIG_CACHE
        value: "/tmp/npm-cache"
      - key: TMPDIR
        value: "/tmp"
