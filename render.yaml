# NPM_CONFIG_CACHE + TMPDIR: Render filesystem can be tight/read-only in places;
# point npm cache and temp files at /tmp so installs/builds succeed.
services:
  - type: web
    name: sheath-academy-dashboard
    runtime: node
    runtimeVersion: 22.22.2
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NPM_CONFIG_CACHE
        value: "/tmp/npm-cache"
      - key: TMPDIR
        value: "/tmp"
