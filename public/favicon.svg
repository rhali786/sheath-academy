<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="#3b82f6"/>

  <!-- Book/Learning symbol -->
  <g transform="translate(45, 45)">
    <!-- Book pages -->
    <path d="M 20 10 L 20 80 Q 20 90 30 90 L 70 90 Q 80 90 80 80 L 80 10"
          fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Page lines -->
    <line x1="35" y1="30" x2="65" y2="30" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="45" x2="65" y2="45" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="60" x2="55" y2="60" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
