<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sheath Academy — Version C (Still)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: #05070f; overflow-x: hidden; }
    .disp { font-family: 'Cormorant Garamond', serif; }
    .ayah { font-family: 'Amiri', serif; }
    @keyframes breathe { 0%,100%{opacity:.35;transform:scale(1);} 50%{opacity:.9;transform:scale(1.15);} }
    .star { animation: breathe 6s ease-in-out infinite; }
    .reveal { opacity:0; transform: translateY(12px); transition: opacity 1.8s ease, transform 1.8s ease; }
    .reveal.in { opacity:1; transform: translateY(0); }
    @media (prefers-reduced-motion: reduce){ .star{animation:none;} .reveal{opacity:1!important;transform:none!important;transition:none;} }
  </style>
</head>
<body class="text-[#ece9df]">
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect } = React;
    function useReveal(){
      useEffect(()=>{ const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')),{threshold:0.4});
        document.querySelectorAll('.reveal').forEach(el=>io.observe(el)); return ()=>io.disconnect(); },[]);
    }

    function Line({ children, delay=0 }) {
      return <p className="reveal" style={{transitionDelay:`${delay}s`}}>{children}</p>;
    }

    function App() {
      useReveal();
      return (
        <div style={{background:'radial-gradient(ellipse at 50% 30%, #0c1024 0%, #070912 55%, #05070f 100%)'}}>
          {/* HERO — the ayah, perfectly set, vast space, one breathing star */}
          <section className="min-h-screen flex flex-col items-center justify-center text-center px-6">
            <div className="star w-1.5 h-1.5 rounded-full bg-[#d4af37] mb-20" style={{boxShadow:'0 0 20px 4px rgba(212,175,55,0.5)'}} />
            <p className="ayah text-6xl sm:text-8xl text-[#e8e2d0] leading-tight" dir="rtl"
               style={{textShadow:'0 0 40px rgba(212,175,55,0.15)'}}>رَّبِّ زِدْنِي عِلْمًا</p>
            <p className="text-sm text-[#8a8f9e] italic mt-8 tracking-wide">"My Lord, increase me in knowledge."</p>
            <p className="text-[11px] text-[#5a5f6e] mt-1 tracking-widest uppercase">Qur'an 20:114</p>
          </section>

          {/* one line per screen — silence between thoughts */}
          <section className="min-h-screen flex items-center justify-center text-center px-6">
            <h1 className="disp text-4xl sm:text-6xl leading-tight max-w-3xl font-light">
              <Line>The school they built at home.</Line>
              <Line delay={0.6}>The record that proves it.</Line>
            </h1>
          </section>

          <section className="min-h-screen flex items-center justify-center text-center px-6">
            <Line>
              <p className="disp text-2xl sm:text-3xl text-[#c9ccd6] max-w-xl leading-relaxed font-light">
                Built from the ground up for Muslim families. Quran, Arabic, and an Islamic
                school year at its core.
              </p>
            </Line>
          </section>

          <section className="min-h-screen flex items-center justify-center text-center px-6">
            <div className="max-w-lg">
              <Line><p className="text-[11px] uppercase tracking-[0.3em] text-[#5a5f6e] mb-8">What it holds</p></Line>
              <div className="space-y-6 disp text-2xl sm:text-3xl text-[#c9ccd6] font-light">
                <Line delay={0.2}>Today's lessons.</Line>
                <Line delay={0.5}>Every Quran session — surah, ayah, revision.</Line>
                <Line delay={0.8}>A year that pauses for Ramadan.</Line>
              </div>
            </div>
          </section>

          <section className="min-h-screen flex items-center justify-center text-center px-6">
            <Line>
              <div className="max-w-xl">
                <p className="disp text-3xl sm:text-4xl text-[#e8e2d0] leading-snug mb-6 font-light">When the review comes, you open one page.</p>
                <p className="text-[#8a8f9e] leading-relaxed">It is all there. The scramble is over.</p>
              </div>
            </Line>
          </section>

          <section className="min-h-screen flex items-center justify-center text-center px-6">
            <Line>
              <div className="max-w-lg">
                <p className="disp text-2xl sm:text-3xl text-[#c9ccd6] leading-relaxed font-light mb-5">
                  No streak counters. No virtue points. No leaderboards.
                </p>
                <p className="text-[#8a8f9e] leading-relaxed text-sm">
                  Spiritual practice is not a metric. Not as an oversight — as a commitment.
                </p>
              </div>
            </Line>
          </section>

          {/* CLOSE */}
          <section className="min-h-screen flex flex-col items-center justify-center text-center px-6">
            <Line>
              <h2 className="disp text-4xl sm:text-5xl font-light mb-12">Built by a Muslim family. For yours.</h2>
            </Line>
            <Line delay={0.4}>
              <div className="flex flex-col items-center gap-4">
                <a href="#" className="inline-flex items-center px-9 py-3.5 rounded-full border border-[#d4af37] text-[#d4af37] tracking-wide hover:bg-[#d4af37] hover:text-[#05070f] transition-colors">
                  Create your household
                </a>
                <a href="#" className="text-sm text-[#8a8f9e] hover:text-[#ece9df]">Already have an account? Sign in</a>
              </div>
            </Line>
            <p className="text-xs text-[#3f4350] mt-20">© 2026 Sheath Academy · Version C (Still) draft</p>
          </section>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
